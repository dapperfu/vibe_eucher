[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-eucher"
version = "0.1.0"
description = "A Python implementation of the classic Euchre card game"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.20.0",
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    "click>=8.0.0",
    "faker>=18.0.0",
    "pony>=0.7.0",
    "rich>=13.0.0",
    "perceiver-pytorch>=0.1.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "pydocstyle>=6.0.0",
]
ai = [
    "openai>=1.0.0",
]

[project.scripts]
eucher = "eucher.cli:main"

[project.entry-points."eucher.plugins"]
random = "eucher.plugins.builtin.random"
heuristic = "eucher.plugins.builtin.heuristic"
heuristic2 = "eucher.plugins.builtin.heuristic"
ai = "eucher.plugins.builtin.ai"
ml_sklearn = "eucher.plugins.builtin.ml"
ml_rl = "eucher.plugins.builtin.ml"
ml_gan = "eucher.plugins.builtin.ml"
ml_pytorch = "eucher.plugins.builtin.ml"
pytorch_ai = "eucher.plugins.builtin.ml"
pytorch_strategic = "eucher.plugins.builtin.ml"
eucher_zero = "eucher.plugins.builtin.eucher_zero"
euchergo = "eucher.plugins.builtin.euchergo"
reinforcement_eucher = "eucher.plugins.builtin.reinforcement_eucher"
perceiver_muzero = "eucher.plugins.builtin.perceiver_muzero"
perceiver_muzero_1 = "eucher.plugins.builtin.perceiver_muzero"
perceiver_muzero_16 = "eucher.plugins.builtin.perceiver_muzero"
perceiver_muzero_64 = "eucher.plugins.builtin.perceiver_muzero"
perceiver_muzero_128 = "eucher.plugins.builtin.perceiver_muzero"

[tool.setuptools]
packages = ["eucher"]

[tool.ruff]
line-length = 100
target-version = "py38"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.pydocstyle]
convention = "numpy"
match = "(?!test_).*\\.py"
match-dir = "(?!test_|tests).*"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

