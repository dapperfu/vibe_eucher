[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "euchre"
version = "0.1.0"
description = "A CLI euchre card game with AI opponents"
authors = [{name = "Your Name", email = "your.email@example.com"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "click>=8.1.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "tqdm>=4.64.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "mypy>=1.5.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
euchre = "euchre.cli:main"

[tool.setuptools.packages.find]
include = ["euchre*"]
exclude = [
    "data*",
    "games*",
    "models*",
    "notebooks*",
    "test_*",
    "demo_*",
    "neural_*",
    "trained_*",
    "venv*",
    "*.py",
]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"] 